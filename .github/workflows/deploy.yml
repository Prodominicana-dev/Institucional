name: Deploy to Remote Server

# El servidor institucional no acepta conexiones SSH entrantes desde internet
# (el workflow anterior fallaba siempre con "dial tcp: i/o timeout"), por eso el
# deploy va al revés: un runner self-hosted instalado en el propio servidor sale
# hacia GitHub y ejecuta estos pasos localmente. No hace falta abrir puertos.
on:
  push:
    branches:
      - main # Cambiar esto al nombre de la rama que quieres que despliegue el proyecto
  workflow_dispatch: # Permite relanzar el deploy a mano desde la pestaña Actions

# El repositorio es público: NO agregar el evento pull_request. Un fork podría
# ejecutar código arbitrario en el servidor de producción. Solo `push` a main,
# que únicamente pueden generar personas con permiso de escritura.

concurrency:
  group: deploy-production
  cancel-in-progress: false # Nunca cortar un deploy a medias

jobs:
  deploy:
    runs-on: [self-hosted, linux, institucional]
    timeout-minutes: 20

    env:
      APP_DIR: /var/www/Institucional

    # Shell de login para que se cargue el PATH del usuario (nvm, pm2, etc.).
    # Como servicio systemd el runner arranca con un entorno mínimo y sin esto
    # no encuentra node ni pm2.
    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - name: Mostrar versiones
        run: |
          echo "node:  $(node -v)"
          echo "npm:   $(npm -v)"
          echo "pm2:   $(pm2 -v)"
          echo "user:  $(whoami)"

      - name: Actualizar código
        run: |
          cd "$APP_DIR"
          git fetch --prune origin
          # ff-only a propósito: si la rama del servidor divergió, o si hay
          # cambios locales que se perderían, el deploy FALLA en vez de
          # sobrescribir. Es un sitio institucional y el servidor tiene
          # archivos y commits propios que no están en GitHub.
          #
          # NUNCA poner aquí `git reset --hard` ni `git clean`: borrarían el
          # .env.local de producción, la ruta (mujeres-exportadoras) que solo
          # existe en el servidor, y los PDFs de guías de inversión.
          git merge --ff-only "origin/${GITHUB_REF_NAME}"
          git log -1 --oneline

      - name: Instalar dependencias
        run: |
          cd "$APP_DIR"
          # install y no `ci`: `npm ci` borra node_modules entero y exige que el
          # lockfile esté sincronizado. En este servidor package-lock.json tiene
          # cambios locales, así que `ci` rompería el deploy.
          npm install --no-audit --no-fund

      - name: Compilar
        run: |
          cd "$APP_DIR"
          npm run build

      - name: Recargar PM2
        run: |
          cd "$APP_DIR"
          # Recarga por NOMBRE, no con ecosystem.config.js. El proceso en
          # producción corre en cluster_mode y con el Node de nvm, una config
          # que no coincide con la del archivo del repo; pasar el archivo le
          # cambiaría el modo de ejecución en caliente.
          pm2 reload Institucional
          pm2 describe Institucional | head -20
